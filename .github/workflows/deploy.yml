name: CI/CD to AWS EKS

on:
  push:
    branches:
      - main    # Memicu saat push ke branch main
    tags:
      - 'v*'    # Memicu saat push tag seperti v1.0.0

jobs:
  build-and-deploy:
    name: Build, Push ECR, and Deploy to EKS
    runs-on: ubuntu-latest
    
    # Environment variables untuk seluruh job
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
      ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
      CLUSTER_NAME: ${{ secrets.CLUSTER_NAME }}
      IMAGE_TAG: ${{ github.ref_name }} # Mengambil nama tag atau branch

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }} # Wajib untuk AWS Academy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, Tag, and Push Docker Image
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Setup kubeconfig
        run: |
          aws eks update-kubeconfig --name $CLUSTER_NAME --region $AWS_REGION

      - name: Deploy to EKS
        env:
          # Variabel tambahan untuk substitusi di file YAML
          API_GATEWAY_URL: ${{ secrets.API_GATEWAY_URL }}
          SNS_TOPIC_ARN: ${{ secrets.SNS_TOPIC_ARN }}
          ATHENA_SCHEMA_NAME: ${{ secrets.ATHENA_SCHEMA_NAME }}
          S3_STAGING_DIR: ${{ secrets.S3_STAGING_DIR }}
        run: |
          # Perbaikan: Menggunakan envsubst untuk memasukkan variabel ke deploy.yaml
          # Pastikan file Anda ada di folder kubernetes/
          envsubst < kubernetes/deploy.yaml | kubectl apply -f -
          kubectl apply -f kubernetes/service.yaml

      - name: Verify Deployment
        run: |
          kubectl get services -o wide
          kubectl get pods