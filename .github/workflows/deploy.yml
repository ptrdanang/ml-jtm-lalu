name: CI/CD to AWS EKS

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build-and-deploy: # Disatukan agar variabel tidak hilang
    name: Build, Push ECR, and Deploy to EKS
    runs-on: ubuntu-latest
    
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
      ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
      CLUSTER_NAME: ${{ secrets.CLUSTER_NAME }}
      # Menggunakan ref_name agar fleksibel (bisa nama branch atau tag)
      IMAGE_TAG: ${{ github.ref_name }} 

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }} # Wajib untuk AWS Academy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, Tag, and Push Docker Image
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Setup kubeconfig
        run: |
          aws eks update-kubeconfig --name $CLUSTER_NAME --region $AWS_REGION

      - name: Deploy to EKS
        env:
          # Pastikan semua variabel ini ada di GitHub Secrets
          API_GATEWAY_URL: ${{ secrets.API_GATEWAY_URL }}
          SNS_TOPIC_ARN: ${{ secrets.SNS_TOPIC_ARN }}
          ATHENA_SCHEMA_NAME: ${{ secrets.ATHENA_SCHEMA_NAME }}
          S3_STAGING_DIR: ${{ secrets.S3_STAGING_DIR }}
        run: |
          # envsubst berfungsi mengganti $VARIABEL di file yaml dengan nilai asli
          envsubst < kubernetes/deploy.yaml | kubectl apply -f -
          kubectl apply -f kubernetes/service.yaml

      - name: Verify Deployment
        run: |
          kubectl get pods -l app=techno-apps
          kubectl get service techno-lb